<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Arca 8th Wall - Este</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- 8th Wall Engine & Extras -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>

  <script>
    const onxrloaded = () => {
      fetch('./image-targets/puppy-card.json')
        .then(response => response.json())
        .then(targetData => {
          XR8.XrController.configure({
            imageTargetData: [targetData],
          });
        })
        .catch(error => console.error('Ошибка загрузки таргета:', error));
    }
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);

    AFRAME.registerComponent('detach-to-world', {
      init: function () {
        let detached = false;
        
        this.el.sceneEl.addEventListener('xrimagefound', (event) => {
          if (!detached) {
            const modelEl = this.el.querySelector('a-gltf-model');
            if (modelEl) {
              const worldPos = new THREE.Vector3();
              const worldQuat = new THREE.Quaternion();
              const worldScale = new THREE.Vector3();

              // 1. Получаем текущие мировые координаты арки
              modelEl.object3D.getWorldPosition(worldPos);
              modelEl.object3D.getWorldQuaternion(worldQuat);
              modelEl.object3D.getWorldScale(worldScale);

              // 2. Переносим элемент в DOM-дерево сцены (отвязываем от маркера)
              this.el.sceneEl.appendChild(modelEl);

              // 3. Восстанавливаем точные координаты в пространстве сцены
              modelEl.object3D.position.copy(worldPos);
              modelEl.object3D.quaternion.copy(worldQuat);
              modelEl.object3D.scale.copy(worldScale);

              detached = true;
            }
          }
        });
      }
    });
  </script>
</head>

<body>
  <!-- 
    Сцена A-Frame:
    xrweb — активирует SLAM и трекинг 8th Wall.
    xrextras-loading / xrextras-runtime-error — стандартный UI загрузки и ошибок.
  -->
  <a-scene
    xrweb="disableWorldTracking: false"
    xrextras-loading
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-runtime-error>

    <!-- Подключаем 3D-модель арки из папки assets -->
    <a-assets>
      <a-asset-item id="archModel" src="./assets/arcageo.glb"></a-asset-item>
    </a-assets>

    <!-- Камера под управлением 8th Wall -->
    <a-camera position="0 1.6 0"></a-camera>

    <!-- Освещение -->
    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" position="1 4 2" intensity="0.8"></a-light>

    <!-- 
      Привязка к маркеру puppy-card.
      При сканировании картинки арка появится в указанных координатах 
      и зафиксируется в пространстве через SLAM.
    -->
    <a-entity xrextras-named-image-target="name: puppy-card" detach-to-world>
      <a-gltf-model
        src="#archModel"
        scale="0.16 0.16 0.16"
        position="0.95 0 0.05"
        rotation="0 0 0">
      </a-gltf-model>
    </a-entity>

  </a-scene>
</body>
</html>
