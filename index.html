<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Arca 8th Wall</title><script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script><script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script><script>const onxrloaded = () => {

    fetch('./image-targets/puppy-card.json')
        .then(r => r.json())
        .then(targetData => {

            XR8.XrController.configure({
                imageTargetData: [targetData]
            })

        })
        .catch(console.error)

}

window.XR8
    ? onxrloaded()
    : window.addEventListener('xrloaded', onxrloaded)



AFRAME.registerComponent('place-arch', {

    init() {

        this.placed = false

        this.target = this.el

        this.model = document.getElementById('arch')

        this.el.sceneEl.addEventListener('xrimagefound', () => {

            if (this.placed)
                return

            if (!this.model.getObject3D('mesh')) {

                this.model.addEventListener('model-loaded', () => {

                    this.place()

                }, {once:true})

            } else {

                this.place()

            }

        })

    },

    place() {

        if (this.placed)
            return

        const worldPos = new THREE.Vector3()
        const worldQuat = new THREE.Quaternion()
        const worldScale = new THREE.Vector3()

        this.model.object3D.getWorldPosition(worldPos)
        this.model.object3D.getWorldQuaternion(worldQuat)
        this.model.object3D.getWorldScale(worldScale)

        this.el.sceneEl.object3D.attach(this.model.object3D)

        this.model.object3D.position.copy(worldPos)
        this.model.object3D.quaternion.copy(worldQuat)
        this.model.object3D.scale.copy(worldScale)

        this.placed = true

        console.log("Arch detached from image target")

    }

})</script></head><body><a-scene xrweb="disableWorldTracking:false" xrextras-loading xrextras-runtime-error xrextras-almost-there xrextras-gesture-detector><a-assets><a-asset-item id="archModel" src="./assets/arcageo.glb"></a-asset-item></a-assets><a-camera position="0 1.6 0"></a-camera><a-light type="ambient" intensity="1.2"></a-light><a-light type="directional" position="1 4 2" intensity="0.8"></a-light><a-entity xrextras-named-image-target="name: puppy-card" place-arch><a-gltf-model id="arch" src="#archModel" position="0 -1 -3" rotation="0 0 0" scale="5.6 5.6 5.6"></a-gltf-model></a-entity></a-scene></body></html>
