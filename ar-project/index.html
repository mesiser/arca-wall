<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Arca Geo AR - Este</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- AR.js для Location-Based AR -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <a-scene
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;">
        
        <a-assets>
            <a-asset-item id="arcaModel" src="arcageo.glb"></a-asset-item>
        </a-assets>

        <!-- GPS-камера с компасом -->
        <a-camera 
    camera="near: 0.1; far: 1000;" 
    gps-camera="enableHighAccuracy: true; positionMinAccuracy: 1000; minDistance: 0;" 
    rotation-reader>
</a-camera>
        
        <!-- ИСПРАВЛЕННАЯ АРКА: масштаб увеличен до 5, добавлено frustum-culled="false" -->
        <a-entity
            gps-entity-place="latitude: 45.22850; longitude: 11.65660;"
            gltf-model="#arcaModel"
            scale="8 8 8"
            rotation="0 0 0"
            position="0 0 0"
            frustum-culled="false">
        </a-entity>

    </a-scene>
</body>
</html>
